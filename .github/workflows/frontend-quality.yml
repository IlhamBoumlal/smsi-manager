name: Frontend Quality

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"

jobs:
  build-strict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run chatbot unit tests
        run: npm run test:unit -- --watchAll=false --runInBand --runTestsByPath src/tests/unit/chatbot/chatbotApi.test.js src/tests/unit/chatbot/ChatbotWidget.test.jsx

      - name: Build (fail on warnings)
        run: npm run build:ci
